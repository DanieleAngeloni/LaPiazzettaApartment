name: Aggiorna disponibilità

on:
  schedule:
    - cron: "17 */3 * * *"   # ogni 3 ore
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: availability
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica i calendari iCal
        run: python3 scripts/update_availability.py
        env:
          ICAL_AIRBNB: ${{ secrets.ICAL_AIRBNB }}
          ICAL_BOOKING: ${{ secrets.ICAL_BOOKING }}

      - name: Salva se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add availability.json
          git diff --cached --quiet || (git commit -m "Aggiorna disponibilità" && git push)
